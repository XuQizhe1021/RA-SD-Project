server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: hq-training-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hq_training}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  file:
    path: ${APP_LOG_DIR:./logs}

app:
  jwt:
    secret: ${APP_JWT_SECRET:hq-training-system-secret-key-change-before-production}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:8}
